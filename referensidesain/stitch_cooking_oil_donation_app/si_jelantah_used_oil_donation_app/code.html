<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"surface-container-highest":"#e0e3e5","on-primary":"#ffffff","surface-container-low":"#f2f4f6","on-tertiary-container":"#00422e","on-background":"#191c1e","tertiary-fixed-dim":"#7bd8b1","on-secondary-container":"#684000","surface-variant":"#e0e3e5","primary":"#006c49","on-surface":"#191c1e","surface-bright":"#f7f9fb","primary-fixed":"#6ffbbe","error":"#ba1a1a","secondary-fixed-dim":"#ffb95f","surface":"#f7f9fb","on-tertiary":"#ffffff","tertiary-fixed":"#97f5cc","background":"#f7f9fb","primary-fixed-dim":"#4edea3","mint-accent":"#34D399","border-grey":"#E2E8F0","slate-muted":"#64748B","outline-variant":"#bbcabf","inverse-on-surface":"#eff1f3","slate-navy":"#0F172A","on-primary-fixed":"#002113","inverse-surface":"#2d3133","tertiary":"#006c4e","error-container":"#ffdad6","status-error":"#EF4444","on-tertiary-fixed-variant":"#00513a","on-primary-container":"#00422b","surface-container-lowest":"#ffffff","on-tertiary-fixed":"#002115","on-primary-fixed-variant":"#005236","status-verified-bg":"#E0F2FE","surface-dim":"#d8dadc","surface-container-high":"#e6e8ea","status-pending-text":"#D97706","on-error":"#ffffff","status-pending-bg":"#FEF3C7","surface-container":"#eceef0","inverse-primary":"#4edea3","on-error-container":"#93000a","outline":"#6c7a71","primary-container":"#10b981","tertiary-container":"#57b48f","secondary-container":"#fea619","on-surface-variant":"#3c4a42","secondary-fixed":"#ffddb8","on-secondary":"#ffffff","status-verified-text":"#0284C7","on-secondary-fixed":"#2a1700","surface-tint":"#006c49","secondary":"#855300","on-secondary-fixed-variant":"#653e00"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"stack-sm":"8px",base:"4px","stack-lg":"24px","gutter-card":"16px","stack-md":"16px","margin-page":"20px"},fontFamily:{"body-md":["Plus Jakarta Sans"],"label-caps":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"display-hero":["Plus Jakarta Sans"]},fontSize:{"body-md":["13px",{lineHeight:"18px",fontWeight:"400"}],"label-caps":["11px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"700"}],"body-lg":["15px",{lineHeight:"22px",fontWeight:"400"}],"headline-md":["18px",{lineHeight:"24px",fontWeight:"600"}],"headline-lg":["24px",{lineHeight:"32px",fontWeight:"700"}],"display-hero":["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"700"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 bg-surface pt-safe pb-safe"><div class="flex flex-col w-full h-full relative" id="auth-container">
<!-- Top Decor -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-fixed-dim/20 rounded-bl-[120px] -z-10 blur-3xl opacity-60"></div>
<div class="absolute -top-10 -left-10 w-48 h-48 bg-tertiary-fixed-dim/30 rounded-full -z-10 blur-2xl opacity-50"></div>
<div class="flex-1 flex flex-col px-margin-page py-stack-lg z-10 w-full max-w-[480px] mx-auto">
<!-- Header Section -->
<div class="flex flex-col items-center text-center mt-8 mb-8 space-y-4">
<div class="w-20 h-20 bg-surface-container rounded-2xl shadow-sm overflow-hidden flex items-center justify-center p-2 ring-4 ring-white relative group">
<img alt="Si Jelantah Logo" class="w-full h-full object-contain transform transition-transform duration-500 group-hover:scale-110" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDW5INT8QTtCK1fst8hJ-03gIgFDFBH9DpMLcnaU4pwfS43yJMsRYYFShQwH0HX0gmRWXNNCaKc6Xk6_UDAOCtkqThaXiqz_E11yocmvs3_r7gBQAetdhcWxGUfMviSazkKqaFubPtCGl0KvrRpk0VVLTqV-QbTaIGZNwqomkFu_V8TtErVBOT0sfRa0LNgDCGYiGIxot28P4dx6CBG8Cu3pLt9cUpz_SnKKN1zAkkKKi4XdCAXxnvX">
<!-- Subtle shine effect -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/40 to-transparent -translate-x-full animate-[shimmer_3s_infinite]"></div>
</div>
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 tracking-tight">Selamat Datang!</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">Ubah Minyak Jelantah Menjadi Kebaikan untuk lingkungan dan sesama bersama Si Jelantah.</p>
</div>
</div>
<!-- Segmented Control -->
<div class="bg-surface-container-high rounded-full p-1 flex relative mb-8 shadow-inner shadow-slate-navy/5">
<!-- Animated slider background -->
<div class="absolute top-1 bottom-1 left-1 bg-surface-container-lowest rounded-full shadow-sm transition-all duration-300 ease-out z-0 w-[calc(50%-4px)]" id="segment-slider"></div>
<button class="flex-1 py-3 text-center relative z-10 font-headline-md text-body-lg text-on-surface transition-colors duration-300" id="btn-login" onclick="switchTab('login')">
        Masuk
      </button>
<button class="flex-1 py-3 text-center relative z-10 font-body-lg text-body-lg text-slate-muted transition-colors duration-300" id="btn-register" onclick="switchTab('register')">
        Daftar
      </button>
</div>
<!-- Forms Container -->
<div class="relative min-h-[320px]">
<!-- LOGIN FORM -->
<form class="absolute inset-0 w-full flex flex-col gap-5 transition-all duration-400 opacity-100 translate-x-0" id="form-login" onsubmit="event.preventDefault(); animateSubmit('login-btn');">
<!-- Email Input -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 ml-1">EMAIL</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm group-focus-within:shadow-md transition-shadow duration-300 ring-1 ring-surface-container group-focus-within:ring-primary">
<span class="material-symbols-outlined absolute left-4 text-slate-muted group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-transparent py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-slate-muted/60 focus:outline-none rounded-xl" placeholder="contoh@email.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 ml-1">PASSWORD</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm group-focus-within:shadow-md transition-shadow duration-300 ring-1 ring-surface-container group-focus-within:ring-primary">
<span class="material-symbols-outlined absolute left-4 text-slate-muted group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-transparent py-4 pl-12 pr-12 font-body-lg text-body-lg text-on-surface placeholder:text-slate-muted/60 focus:outline-none rounded-xl" id="login-password" placeholder="Masukkan password" required="" type="password">
<button class="absolute right-4 text-slate-muted hover:text-on-surface focus:outline-none" onclick="togglePassword('login-password', 'login-eye')" type="button">
<span class="material-symbols-outlined text-[20px]" id="login-eye">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-end -mt-1">
<button class="font-label-caps text-body-md text-primary hover:text-tertiary transition-colors" type="button">Lupa Password?</button>
</div>
<!-- Submit Button -->
<button class="w-full mt-4 bg-primary text-on-primary py-4 rounded-[16px] font-headline-md text-headline-md shadow-md shadow-primary/20 active:scale-[0.98] transition-all duration-200 relative overflow-hidden flex items-center justify-center" id="login-btn" type="submit">
<span class="relative z-10 flex items-center gap-2">
            Masuk
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 -translate-x-full peer-active:animate-[shimmer_0.5s]"></div>
</button>
</form>
<!-- REGISTER FORM -->
<form class="absolute inset-0 w-full flex flex-col gap-4 transition-all duration-400 opacity-0 translate-x-8 pointer-events-none" id="form-register" onsubmit="event.preventDefault(); animateSubmit('register-btn');">
<div class="grid grid-cols-1 gap-4 overflow-y-auto pb-4 -mx-1 px-1 custom-scrollbar">
<!-- Nama -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1">NAMA LENGKAP</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm ring-1 ring-surface-container group-focus-within:ring-primary transition-shadow">
<span class="material-symbols-outlined absolute left-4 text-slate-muted text-[20px]">person</span>
<input class="w-full bg-transparent py-3 pl-12 pr-4 font-body-md text-body-md focus:outline-none rounded-xl" placeholder="Budi Santoso" required="" type="text">
</div>
</div>
<!-- HP -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1">NOMOR HP</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm ring-1 ring-surface-container group-focus-within:ring-primary transition-shadow">
<span class="material-symbols-outlined absolute left-4 text-slate-muted text-[20px]">phone_iphone</span>
<input class="w-full bg-transparent py-3 pl-12 pr-4 font-body-md text-body-md focus:outline-none rounded-xl" placeholder="08123456789" required="" type="tel">
</div>
</div>
<!-- Email -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1">EMAIL</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm ring-1 ring-surface-container group-focus-within:ring-primary transition-shadow">
<span class="material-symbols-outlined absolute left-4 text-slate-muted text-[20px]">mail</span>
<input class="w-full bg-transparent py-3 pl-12 pr-4 font-body-md text-body-md focus:outline-none rounded-xl" placeholder="contoh@email.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div class="group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1">PASSWORD</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm ring-1 ring-surface-container group-focus-within:ring-primary transition-shadow">
<span class="material-symbols-outlined absolute left-4 text-slate-muted text-[20px]">lock</span>
<input class="w-full bg-transparent py-3 pl-12 pr-12 font-body-md text-body-md focus:outline-none rounded-xl" id="reg-password" placeholder="Minimal 8 karakter" required="" type="password">
<button class="absolute right-4 text-slate-muted focus:outline-none" onclick="togglePassword('reg-password', 'reg-eye')" type="button">
<span class="material-symbols-outlined text-[18px]" id="reg-eye">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 bg-primary text-on-primary py-4 rounded-[16px] font-headline-md text-headline-md shadow-md shadow-primary/20 active:scale-[0.98] transition-transform flex items-center justify-center" id="register-btn" type="submit">
          Daftar Akun
        </button>
</form>
</div>
<!-- Footer -->
<div class="mt-auto pt-8 pb-4 text-center">
<p class="font-body-md text-[12px] text-slate-muted mb-2">
        Butuh bantuan? <a class="text-primary font-headline-md text-[12px] hover:underline" href="#">Hubungi Kami</a>
</p>
<p class="font-body-md text-[11px] text-slate-muted/70 max-w-[250px] mx-auto">Dengan masuk atau mendaftar Si Jelantah, Anda menyetujui <br> Syarat &amp; Ketentuan serta Kebijakan Privasi kami.</p>
</div>
</div>
<style>
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
    
    /* Custom scrollbar for register form if it overflows on very small screens */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #E2E8F0;
      border-radius: 4px;
    }
  </style>
<script>
    function switchTab(tab) {
      const slider = document.getElementById('segment-slider');
      const btnLogin = document.getElementById('btn-login');
      const btnRegister = document.getElementById('btn-register');
      
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (tab === 'login') {
        // Slider movement
        slider.style.transform = 'translateX(0)';
        
        // Button styling
        btnLogin.classList.replace('font-body-lg', 'font-headline-md');
        btnLogin.classList.replace('text-slate-muted', 'text-on-surface');
        
        btnRegister.classList.replace('font-headline-md', 'font-body-lg');
        btnRegister.classList.replace('text-on-surface', 'text-slate-muted');

        // Form transitions
        formLogin.style.opacity = '1';
        formLogin.style.transform = 'translateX(0)';
        formLogin.style.pointerEvents = 'auto';

        formRegister.style.opacity = '0';
        formRegister.style.transform = 'translateX(8px)';
        formRegister.style.pointerEvents = 'none';

      } else {
        // Slider movement (calc(100% + 4px) to account for padding/gap)
        slider.style.transform = 'translateX(calc(100% + 4px))';
        
        // Button styling
        btnRegister.classList.replace('font-body-lg', 'font-headline-md');
        btnRegister.classList.replace('text-slate-muted', 'text-on-surface');
        
        btnLogin.classList.replace('font-headline-md', 'font-body-lg');
        btnLogin.classList.replace('text-on-surface', 'text-slate-muted');

        // Form transitions
        formRegister.style.opacity = '1';
        formRegister.style.transform = 'translateX(0)';
        formRegister.style.pointerEvents = 'auto';

        formLogin.style.opacity = '0';
        formLogin.style.transform = 'translateX(-8px)';
        formLogin.style.pointerEvents = 'none';
      }
    }

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
        icon.classList.add('text-primary');
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
        icon.classList.remove('text-primary');
      }
    }

    function animateSubmit(btnId) {
      const btn = document.getElementById(btnId);
      const originalText = btn.innerHTML;
      
      // Loading state
      btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span>`;
      btn.style.opacity = '0.9';
      
      // Simulate network request
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Berhasil`;
        btn.classList.add('bg-primary-container', 'text-on-primary-container');
        
        setTimeout(() => {
          // Reset (in a real app, this would navigate away)
          btn.innerHTML = originalText;
          btn.classList.remove('bg-primary-container', 'text-on-primary-container');
          btn.style.opacity = '1';
        }, 1500);
      }, 1500);
    }
  </script>
</div></main>

</body></html>
